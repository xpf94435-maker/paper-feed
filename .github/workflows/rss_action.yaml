name: Auto RSS Fetch
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'solid_feed.py'
      - 'get_RSS.py'
      - 'requirements.txt'
      - '.github/workflows/rss_action.yaml'
concurrency:
  group: paper-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile solid_feed.py get_RSS.py
      - name: Fetch solid electrolyte papers
        run: python solid_feed.py
      - name: Build reading page with original abstracts
        run: python solid_feed.py --build
      - name: Save RSS history and configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add filtered_feed.xml fetch_status.json keywords.dat journals.dat
          if ! git diff --cached --quiet; then
            git commit -m "Update solid electrolyte literature feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
